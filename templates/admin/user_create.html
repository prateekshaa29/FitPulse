{% extends 'base.html' %}

{% block title %}Create User - Admin Portal{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card card-dark shadow-lg">
                <div class="card-header card-header-dark d-flex justify-content-between align-items-center">
                    <span class="text-white fw-bold"><i class="bi bi-person-plus-fill text-emerald me-2"></i> Create New User Account</span>
                    <a href="{{ url_for('admin.list_users') }}" class="btn btn-sm btn-outline-custom">Back to Users</a>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('admin.create_user') }}">
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="name" class="form-label form-label-dark">Full Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control form-control-dark" id="name" name="name" value="{{ name or '' }}" placeholder="e.g. John Doe" required>
                            </div>
                            <div class="col-md-6">
                                <label for="email" class="form-label form-label-dark">Email Address <span class="text-danger">*</span></label>
                                <input type="email" class="form-control form-control-dark" id="email" name="email" value="{{ email or '' }}" placeholder="john@example.com" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="password" class="form-label form-label-dark">Initial Password <span class="text-danger">*</span></label>
                                <input type="password" class="form-control form-control-dark" id="password" name="password" placeholder="Min 6 characters" minlength="6" required>
                            </div>
                            <div class="col-md-6">
                                <label for="role" class="form-label form-label-dark">System Role <span class="text-danger">*</span></label>
                                <select class="form-select form-select-dark" id="role" name="role" required>
                                    <option value="user" {% if role == 'user' %}selected{% endif %}>User (Client)</option>
                                    <option value="trainer" {% if role == 'trainer' %}selected{% endif %}>Trainer</option>
                                    <option value="nutritionist" {% if role == 'nutritionist' %}selected{% endif %}>Nutritionist</option>
                                    <option value="admin" {% if role == 'admin' %}selected{% endif %}>Administrator</option>
                                </select>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="gender" class="form-label form-label-dark">Gender</label>
                                <select class="form-select form-select-dark" id="gender" name="gender">
                                    <option value="">Select Gender</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="age" class="form-label form-label-dark">Age (years)</label>
                                <input type="number" class="form-control form-control-dark" id="age" name="age" placeholder="e.g. 30" min="5" max="120">
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="height" class="form-label form-label-dark">Height (cm)</label>
                                <input type="number" step="0.1" class="form-control form-control-dark" id="height" name="height" placeholder="e.g. 175" min="50" max="260">
                            </div>
                            <div class="col-md-6">
                                <label for="weight" class="form-label form-label-dark">Weight (kg)</label>
                                <input type="number" step="0.1" class="form-control form-control-dark" id="weight" name="weight" placeholder="e.g. 70.0" min="20" max="400">
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a href="{{ url_for('admin.list_users') }}" class="btn btn-outline-custom">Cancel</a>
                            <button type="submit" class="btn btn-emerald">
                                <i class="bi bi-check2-circle me-1"></i> Create Account
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
