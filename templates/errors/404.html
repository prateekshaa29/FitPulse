{% extends 'base.html' %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card card-dark p-5 mx-auto shadow-lg" style="max-width: 550px;">
        <div class="stat-icon icon-amber mx-auto mb-3" style="width: 70px; height: 70px; font-size: 2.2rem;">
            <i class="bi bi-compass-fill"></i>
        </div>
        <h1 class="display-4 fw-bold text-white mb-2">404</h1>
        <h4 class="text-white fw-semibold mb-3">Page Not Found</h4>
        <p class="text-secondary small mb-4">The page or fitness record you requested could not be located on the server.</p>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-emerald px-4">
            <i class="bi bi-house-door-fill me-1"></i> Return Home
        </a>
    </div>
</div>
{% endblock %}
