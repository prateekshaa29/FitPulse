{% extends 'base.html' %}

{% block title %}500 - Internal Server Error{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card card-dark p-5 mx-auto shadow-lg" style="max-width: 550px;">
        <div class="stat-icon icon-rose mx-auto mb-3" style="width: 70px; height: 70px; font-size: 2.2rem;">
            <i class="bi bi-cpu-fill"></i>
        </div>
        <h1 class="display-4 fw-bold text-white mb-2">500</h1>
        <h4 class="text-white fw-semibold mb-3">Internal System Error</h4>
        <p class="text-secondary small mb-4">An unexpected error occurred while processing your request. The transaction has been rolled back safely.</p>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-emerald px-4">
            <i class="bi bi-house-door-fill me-1"></i> Return Home
        </a>
    </div>
</div>
{% endblock %}
