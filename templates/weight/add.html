{% extends 'base.html' %}

{% block title %}Log Weight - FitPulse{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card card-dark shadow-lg">
                <div class="card-header card-header-dark d-flex justify-content-between align-items-center">
                    <span class="text-white fw-bold"><i class="bi bi-speedometer2 text-info me-2"></i> Log Weight Measurement</span>
                    <a href="{{ url_for('weight.history') }}" class="btn btn-sm btn-outline-custom">History</a>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('weight.add') }}">
                        <div class="mb-3">
                            <label for="weight" class="form-label form-label-dark">Weight (kg) <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <input type="number" step="0.1" class="form-control form-control-dark" id="weight" name="weight" value="{{ weight or (user.weight if user else '') }}" placeholder="e.g. 72.5" min="20" max="400" required autofocus>
                                <span class="input-group-text bg-dark border-secondary text-secondary">kg</span>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="date" class="form-label form-label-dark">Measurement Date <span class="text-danger">*</span></label>
                            <input type="date" class="form-control form-control-dark" id="date" name="date" value="{{ date or today_date }}" required>
                        </div>

                        <div class="mb-4">
                            <label for="notes" class="form-label form-label-dark">Notes (Optional)</label>
                            <input type="text" class="form-control form-control-dark" id="notes" name="notes" value="{{ notes or '' }}" placeholder="e.g. Morning weighing, post-workout">
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a href="{{ url_for('weight.history') }}" class="btn btn-outline-custom">Cancel</a>
                            <button type="submit" class="btn btn-emerald">
                                <i class="bi bi-check2-circle me-1"></i> Save Weight Entry
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
