{% extends 'base.html' %}

{% block title %}Edit Workout - FitPulse{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card card-dark shadow-lg">
                <div class="card-header card-header-dark d-flex justify-content-between align-items-center">
                    <span class="text-white fw-bold"><i class="bi bi-pencil-square text-cyan me-2"></i> Edit Workout Record</span>
                    <a href="{{ url_for('workout.history') }}" class="btn btn-sm btn-outline-custom">Back to History</a>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('workout.edit', workout_id=workout.id) }}">
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="workout_type" class="form-label form-label-dark">Workout Type <span class="text-danger">*</span></label>
                                <select class="form-select form-select-dark" id="workout_type" name="workout_type" required>
                                    {% for wt in workout_types %}
                                        <option value="{{ wt }}" {% if workout.workout_type == wt %}selected{% endif %}>{{ wt }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="exercise_name" class="form-label form-label-dark">Exercise / Routine Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control form-control-dark" id="exercise_name" name="exercise_name" value="{{ workout.exercise_name }}" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label for="duration" class="form-label form-label-dark">Duration (minutes) <span class="text-danger">*</span></label>
                                <input type="number" class="form-control form-control-dark" id="duration" name="duration" value="{{ workout.duration }}" min="1" max="1440" required>
                            </div>
                            <div class="col-md-4">
                                <label for="sets" class="form-label form-label-dark">Sets</label>
                                <input type="number" class="form-control form-control-dark" id="sets" name="sets" value="{{ workout.sets or '0' }}" min="0">
                            </div>
                            <div class="col-md-4">
                                <label for="repetitions" class="form-label form-label-dark">Reps / Distance</label>
                                <input type="number" class="form-control form-control-dark" id="repetitions" name="repetitions" value="{{ workout.repetitions or '0' }}" min="0">
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="calories_burned" class="form-label form-label-dark">Calories Burned (kcal)</label>
                                <input type="number" step="0.1" class="form-control form-control-dark" id="calories_burned" name="calories_burned" value="{{ workout.calories_burned }}" min="0">
                            </div>
                            <div class="col-md-6">
                                <label for="workout_date" class="form-label form-label-dark">Workout Date <span class="text-danger">*</span></label>
                                <input type="date" class="form-control form-control-dark" id="workout_date" name="workout_date" value="{{ workout.workout_date.strftime('%Y-%m-%d') }}" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="notes" class="form-label form-label-dark">Notes</label>
                            <textarea class="form-control form-control-dark" id="notes" name="notes" rows="3">{{ workout.notes or '' }}</textarea>
                        </div>

                        <div class="d-flex justify-content-between align-items-center">
                            <button type="button" class="btn btn-outline-danger btn-delete-trigger" data-bs-toggle="modal" data-bs-target="#deleteConfirmModal" data-action="{{ url_for('workout.delete', workout_id=workout.id) }}" data-name="{{ workout.exercise_name }}">
                                <i class="bi bi-trash me-1"></i> Delete
                            </button>
                            <div class="d-flex gap-2">
                                <a href="{{ url_for('workout.history') }}" class="btn btn-outline-custom">Cancel</a>
                                <button type="submit" class="btn btn-emerald">
                                    <i class="bi bi-floppy me-1"></i> Update Workout
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
